
name: AtomicLife - Build y Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Verificar y compilar AtomicLife
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Mostrar version de Flutter
        run: flutter --version

      - name: Restaurar configuracion Android de Firebase
        env:
          FIREBASE_JSON_BASE64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ ! -f android/app/google-services.json ]; then
            if [ -z "$FIREBASE_JSON_BASE64" ]; then
              echo "ERROR: falta google-services.json y el secreto de Firebase."
              exit 1
            fi
            printf '%s' "$FIREBASE_JSON_BASE64" | base64 --decode > android/app/google-services.json
          fi

      - name: Verificar configuracion Firebase
        run: |
          test -s lib/firebase_options.dart
          test -s android/app/google-services.json

      - name: Instalar dependencias Flutter
        run: flutter pub get

      - name: Analizar codigo Dart
        run: flutter analyze

      - name: Ejecutar pruebas
        run: flutter test

      - name: Compilar APK Release
        run: flutter build apk --release

      - name: Preparar APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk AtomicLife-${{ github.ref_name }}.apk

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: AtomicLife-APK
          path: AtomicLife-${{ github.ref_name }}.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publicar GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: AtomicLife-${{ github.ref_name }}.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
